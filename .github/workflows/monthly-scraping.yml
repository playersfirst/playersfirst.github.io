# .github/workflows/monthly-scraping.yml
name: Monthly Player Data Scraping

on:
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas beautifulsoup4 openpyxl lxml
    
    - name: Run scraper
      run: |
        python scraper.py
        echo "Scraping completed"
    
    - name: Rename output file to jose_new.xlsx
      run: |
        # Find the generated file (it has timestamp in name)
        GENERATED_FILE=$(ls transfermarkt_u28_players_*.xlsx | head -1)
        if [ -f "$GENERATED_FILE" ]; then
          cp "$GENERATED_FILE" jose_new.xlsx
          echo "File renamed to jose_new.xlsx"
          ls -la jose_new.xlsx
        else
          echo "No generated file found"
          exit 1
        fi
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add jose_new.xlsx
        git add scraper.log
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update player data - $(date +'%Y-%m-%d')"
          git push
          echo "Changes pushed successfully"
        fi
    
    - name: Upload artifacts (for debugging)
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: scraping-results
        path: |
          *.xlsx
          *.log
        retention-days: 30
