# .github/workflows/matrix-scraping.yml
name: MATRIX TURBO Player Data Scraping
on:
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  # MATRIX STRATEGY - Multiple machines with different IPs!
  matrix-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours per worker
    strategy:
      matrix:
        worker_id: [0, 1, 2, 3, 4]  # 5 workers = 5 different IPs!
      fail-fast: false  # Don't cancel other workers if one fails
      max-parallel: 5   # All workers run simultaneously
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas beautifulsoup4 openpyxl lxml
        echo "Dependencies installed for worker ${{ matrix.worker_id }}"
    
    - name: Run Matrix Worker
      run: |
        echo "🚀 Starting Matrix Worker ${{ matrix.worker_id }}/5..."
        python scraper.py --worker-id ${{ matrix.worker_id }} --total-workers 5
        echo "✅ Worker ${{ matrix.worker_id }} completed"
    
    - name: Upload worker results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: worker-${{ matrix.worker_id }}-results
        path: |
          transfermarkt_worker_${{ matrix.worker_id }}_*.xlsx
          transfermarkt_worker_${{ matrix.worker_id }}_*.json
          scraper.log
        retention-days: 30

  # MERGE JOB - Combines all worker results
  merge-results:
    needs: matrix-scrape
    runs-on: ubuntu-latest
    if: always()  # Run even if some workers fail
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl
    
    - name: Download all worker results
      uses: actions/download-artifact@v4
      with:
        path: worker-results/
    
    - name: Merge worker results
      run: |
        python -c "
import pandas as pd
import json
import os
from glob import glob

print('🔄 Merging worker results...')

all_data = []
total_players = 0
instagram_count = 0

# Find all JSON files from workers
for worker_dir in glob('worker-results/worker-*-results/'):
    json_files = glob(f'{worker_dir}transfermarkt_worker_*.json')
    for json_file in json_files:
        print(f'Processing: {json_file}')
        try:
            with open(json_file, 'r', encoding='utf-8') as f:
                worker_data = json.load(f)
                all_data.extend(worker_data)
                print(f'Added {len(worker_data)} players from {json_file}')
        except Exception as e:
            print(f'Error reading {json_file}: {e}')

if all_data:
    # Remove duplicates based on name and profile URL
    seen = set()
    unique_data = []
    for player in all_data:
        key = f\"{player['Name']}|{player['Transfermarkt']}\"
        if key not in seen:
            seen.add(key)
            unique_data.append(player)
    
    print(f'Original: {len(all_data)}, Unique: {len(unique_data)}')
    
    # Create DataFrame and sort
    df = pd.DataFrame(unique_data)
    df = df.sort_values('Value (M€)', ascending=False)
    
    # Save final merged file
    with pd.ExcelWriter('jose_new.xlsx', engine='openpyxl') as writer:
        df.to_excel(writer, index=False, sheet_name='Players')
        
        worksheet = writer.sheets['Players']
        worksheet.column_dimensions['A'].width = 30
        worksheet.column_dimensions['B'].width = 15
        worksheet.column_dimensions['C'].width = 50
        worksheet.column_dimensions['D'].width = 50
    
    total_players = len(df)
    instagram_count = len(df[df['Instagram'] != ''])
    
    print(f'✅ Merged file created: jose_new.xlsx')
    print(f'👥 Total unique players: {total_players}')
    print(f'📸 With Instagram: {instagram_count}')
    print(f'💰 Value range: {df[\"Value (M€)\"].min():.1f}M€ - {df[\"Value (M€)\"].max():.1f}M€')
else:
    print('❌ No data found to merge')
    exit(1)
        "
    
    - name: Commit and push merged results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Matrix Scraper Bot"
        
        if [ -f "jose_new.xlsx" ]; then
          git add jose_new.xlsx
          
          # Get player count for commit message
          PLAYER_COUNT=$(python -c "import pandas as pd; df=pd.read_excel('jose_new.xlsx'); print(len(df))" 2>/dev/null || echo 'unknown')
          INSTAGRAM_COUNT=$(python -c "import pandas as pd; df=pd.read_excel('jose_new.xlsx'); print(len(df[df['Instagram'] != '']))" 2>/dev/null || echo 'unknown')
          
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "🚀 MATRIX Update: ${PLAYER_COUNT} players (${INSTAGRAM_COUNT} with Instagram) - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Matrix results pushed successfully"
          fi
        else
          echo "❌ No merged file to commit"
          exit 1
        fi
    
    - name: Upload final merged results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-merged-results
        path: |
          jose_new.xlsx
        retention-days: 90
    
    - name: Matrix Summary
      if: always()
      run: |
        echo "🎉 MATRIX SCRAPING WORKFLOW COMPLETE!"
        echo "🤖 Workers used: 5 different IPs"
        echo "📁 Final file: jose_new.xlsx"
        if [ -f "jose_new.xlsx" ]; then
          echo "📊 File size: $(du -h jose_new.xlsx | cut -f1)"
          PLAYER_COUNT=$(python -c "import pandas as pd; df=pd.read_excel('jose_new.xlsx'); print(len(df))" 2>/dev/null || echo 'unknown')
          echo "👥 Total players: ${PLAYER_COUNT}"
        fi
